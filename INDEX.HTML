<!DOCTYPE html>
<html lang="es">
  <head>
    <title>HTML básico</title>
    <meta charset="utf-8" />
  </head>
  <body>
    <header>
      <h1>PORTFOLIO</h1>
    </header>

    <nav id="menu">
      <ul>
        <li>
          <a href="#ABOUTME">ABOUT ME</a>
        </li>
        <li>
          <a href="#PROJECTS">PROJECTS</a>
        </li>
        <li>
          <a href="#CONTACT">CONTACT</a>
        </li>
      </ul>
    </nav>

    <section id="ABOUTME">
      <h2><i class="fa-solid fa-city"></i>ABOUT ME</h2>
      <div>
        <div>
          <p>Parrafo</p>
        </div>
        <figure>
          <img src="img/15825342581.jpg" alt="Huerto de Calisto y Melibea" />
        </figure>
      </div>
    </section>

    <section id="PROJECTS">
      <h2><i class="fa-solid fa-map-location"></i>PROJECTS</h2>
      <div>
        <!-- Cada imagen estara metida en un figure -->
        <figure>
          <img src="img/planes1.jpg" alt="" />
          <figcaption>
            <a
              href="https://salamanca.es/es/propuestas-especiales/salamanca-en-2-y-3-dias/salamanca-en-2-dias"
              target="_blank"
              title="Se abre en otra ventana"
            >
              Salamanca en dos y tres días
            </a>
          </figcaption>
        </figure>
      </div>
    </section>

    <section id="CONTACT">
      <h2><i class="fa-solid fa-truck-plane"></i>CONTACT</h2>
      <p>Parrafo</p>
      <div>
        <figure>
          <img src="img/ALSA_2019_logo.svg.png" alt="logotipo de alsa" />
        </figure>
        <figure>
          <img
            src="img/logo-vector-avanza-grupo.1.png"
            alt="logotipo de avanza"
          />
        </figure>
      </div>
    </section>

    <footer>
      <p>
        Información extraída de
        <a
          href="https://salamanca.es/es/"
          target="_blank"
          title="Se abre en una nueva pestaña"
        >
          Turismo Salamanca
        </a>
      </p>
    </footer>
  </body>
</html>
